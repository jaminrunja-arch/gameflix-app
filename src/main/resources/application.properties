spring.application.name=gameflix-auth

spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gameflix}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.issuer=gameflix-auth
jwt.expiration-minutes=30

app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
